name: Transferência temporária de diagnóstico

on:
  push:
    paths:
      - '.github/workflows/bigxr-transfer-temp.yml'
  workflow_dispatch:
    inputs:
      build_kind:
        description: 'Tipo do artefato'
        required: true
        type: choice
        default: xr
        options:
          - xr
          - questcraft
      build_run:
        description: 'ID da build integrada (0 para transferir só a captura)'
        required: true
        type: string
      capture_run:
        description: 'ID do teste de captura'
        required: false
        type: string
      log_job:
        description: 'ID opcional do job para recuperar o log'
        required: false
        type: string
      key:
        description: 'Chave efêmera de transferência'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recuperar os artefatos solicitados
        shell: bash
        run: |
          set -euo pipefail
          build=$(python3 -c 'import json,os,re; x=json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]["build_run"]; assert re.fullmatch(r"[0-9]+",x); print(x)')
          capture=$(python3 -c 'import json,os,re; x=json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"].get("capture_run", ""); assert not x or re.fullmatch(r"[0-9]+",x); print(x)')
          log_job=$(python3 -c 'import json,os,re; x=json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"].get("log_job", ""); assert not x or re.fullmatch(r"[0-9]+",x); print(x)')
          kind=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"].get("build_kind", "xr"))')
          case "$kind" in
            xr) artifact=BigXR-experimental; capture_artifact=bigxr-criador-teste-emulador ;;
            questcraft) artifact=QuestCraft-Mobile-unico-experimental; capture_artifact=questcraft-captura-emulador ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/transfer-apk" "$RUNNER_TEMP/transfer-capture"
          if [ "$build" != 0 ]; then
            gh run download "$build" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/transfer-apk"
          fi
          if [ -n "$capture" ]; then
            gh run download "$capture" --repo "$GITHUB_REPOSITORY" --name "$capture_artifact" --dir "$RUNNER_TEMP/transfer-capture"
          fi
          if [ -n "$log_job" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$log_job/logs" > "$RUNNER_TEMP/transfer-capture/job-log.txt" 2> "$RUNNER_TEMP/log-fetch-error.txt"; then
              error=$(tr '\n' ' ' < "$RUNNER_TEMP/log-fetch-error.txt" | cut -c1-1500)
              printf '::error title=Log retrieval failed::%s\n' "$error"
              exit 1
            fi
          fi
      - name: Transferir arquivos criptografados por objetos temporários
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, zipfile
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          key = event['inputs']['key']
          if not re.fullmatch(r'[a-f0-9]{64}', key):
              raise SystemExit('Invalid ephemeral key')
          print('::add-mask::' + key, flush=True)
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          kind = event['inputs'].get('build_kind', 'xr')
          apk_name = 'BigXR-debug.apk' if kind == 'xr' else 'QuestCraft-Mobile-debug.apk'
          apk = temp / 'transfer-apk' / apk_name
          capture_dir = temp / 'transfer-capture'
          sources = [('TEMP_APK_BLOBS', apk)] if apk.exists() else []
          if any(capture_dir.iterdir()):
              archive = temp / 'capture.zip'
              with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as out:
                  for path in sorted(capture_dir.rglob('*')):
                      if path.is_file() and path.suffix != ".apk": out.write(path, path.relative_to(capture_dir))
              sources.append(('TEMP_CAPTURE_BLOBS', archive))
          repo = os.environ['GITHUB_REPOSITORY']
          for title, source in sources:
              iv = os.urandom(16).hex()
              encrypted = temp / (title + '.enc')
              subprocess.run(['openssl', 'enc', '-aes-256-ctr', '-K', key, '-iv', iv,
                              '-in', str(source), '-out', str(encrypted)], check=True)
              chunks = []
              with encrypted.open('rb') as handle:
                  while data := handle.read(8 * 1024 * 1024):
                      payload = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode()
                      result = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repo}/git/blobs', '--input', '-'],
                                              input=payload, stdout=subprocess.PIPE, check=True)
                      sha = json.loads(result.stdout)['sha']
                      expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                      if sha != expected: raise SystemExit('Blob SHA-1 mismatch')
                      chunks.append(sha)
              manifest = {'iv': iv, 'size': source.stat().st_size,
                          'sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                          'encrypted_sha256': hashlib.sha256(encrypted.read_bytes()).hexdigest(), 'chunks': chunks}
              encoded = base64.b64encode(json.dumps(manifest, separators=(',', ':')).encode()).decode()
              print(f'::notice title={title}::{encoded}', flush=True)
          PY
