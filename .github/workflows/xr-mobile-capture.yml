name: Teste do launcher XR no emulador

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'ID da build BigXR que será testada'
        type: string
        required: true
      quick:
        description: 'Somente diagnóstico OpenXR headless (sem testar o seletor ou a câmera)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Baixar launcher e preparar APK descartável de teste
        env:
          GH_TOKEN: ${{ github.token }}
          XR_TEST_QUICK: ${{ inputs.quick == true && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          build=$(python3 -c 'import json,os,re; x=(json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}).get("build_run", ""); assert not x or re.fullmatch(r"[0-9]+",x); print(x)')
          if [ -z "$build" ]; then
            build=$(gh run list --workflow xr-mobile.yml --branch "$GITHUB_REF_NAME" --status success --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$build"
          echo "Testando a build $build"
          mkdir -p "$RUNNER_TEMP/xr-apk" "$RUNNER_TEMP/xr-headers/openxr" "$RUNNER_TEMP/xr-loader/arm64-v8a" "$RUNNER_TEMP/xr-model" "$RUNNER_TEMP/xr-test-image"
          gh run download "$build" --name BigXR-experimental --dir "$RUNNER_TEMP/xr-apk"
          sha256sum "$RUNNER_TEMP/xr-apk/BigXR-debug.apk"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/xr-model/hand_landmarker.task" \
            'https://raw.githubusercontent.com/samrat1games/phonexr/f393ea8c3f4579995efb7402d61a2108121b0900/orangehanding/src/main/assets/hand_landmarker.task'
          echo 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1  '"$RUNNER_TEMP/xr-model/hand_landmarker.task" | sha256sum -c -
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/xr-test-image/hand.jpg" \
            'https://raw.githubusercontent.com/google-ai-edge/mediapipe-samples/b74eeb6d4952d97f244e03fefe4513637e59210f/examples/hand_landmarker/android/app/src/androidTest/assets/test_image.jpg'
          echo '7584b748aa0c57a8cce3acd9e40149f5d4d7317f7db47c8a5a5f4a8fba9090ec  '"$RUNNER_TEMP/xr-test-image/hand.jpg" | sha256sum -c -
          for header in openxr.h openxr_platform.h openxr_platform_defines.h; do
            curl --fail --location --retry 3 -o "$RUNNER_TEMP/xr-headers/openxr/$header" \
              "https://raw.githubusercontent.com/KhronosGroup/OpenXR-SDK/7f9285bce1ce8b69bb75554bf788666579d0c35e/include/openxr/$header"
          done
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          from questcraft_mobile.build_apk import LOADER_URL, LOADER_SHA256, verify_hash
          loader = Path(os.environ['RUNNER_TEMP'])/'xr-loader/arm64-v8a/libopenxr_loader.so'
          subprocess.run(['curl', '--fail', '--location', '--retry', '5', '--retry-all-errors',
                          '-H', 'Accept: application/vnd.github.raw+json',
                          '-H', 'Authorization: Bearer ' + os.environ['GH_TOKEN'],
                          '-o', str(loader), LOADER_URL], check=True)
          verify_hash(loader, LOADER_SHA256, False, 'Loader OpenXR da fixture')
          PY
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.0.12077973'
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmake;3.22.1'
          fi
          export XR_HEADER_DIR="$RUNNER_TEMP/xr-headers" XR_LOADER_DIR="$RUNNER_TEMP/xr-loader"
          export XR_HAND_MODEL_DIR="$RUNNER_TEMP/xr-model" XR_HAND_TEST_IMAGE_DIR="$RUNNER_TEMP/xr-test-image"
          gradle -p xr_mobile/probe --no-daemon assembleDebug
          if [ "$XR_TEST_QUICK" != 1 ]; then
            curl --fail --location --retry 3 -o "$RUNNER_TEMP/ARSCLib.jar" \
              'https://github.com/REAndroid/ARSCLib/releases/download/V1.4.0/ARSCLib-1.4.0.jar'
            echo '0cc95b160ba4c731a5cadb455f32b79f4e64b4160bc5ec3e5183ea3676b385ce  '"$RUNNER_TEMP/ARSCLib.jar" | sha256sum -c -
            curl --fail --location --retry 5 --retry-all-errors -H 'Accept: application/vnd.github.raw+json' \
              -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/phonexr-runtime.apk" \
              'https://api.github.com/repos/samrat1games/phonexr/contents/app/src/main/assets/runtime/phonexr-runtime.apk?ref=f393ea8c3f4579995efb7402d61a2108121b0900'
            echo '56dd0f53317e1e70d240d4de39217f7553011a04b1d4cf22a637de6d1ebf7fa8  '"$RUNNER_TEMP/phonexr-runtime.apk" | sha256sum -c -
            curl --fail --location --retry 3 -o "$RUNNER_TEMP/apktool.jar" \
              'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
            gradle -p xr_mobile/embedded --no-daemon assembleRelease
            python3 xr_mobile/build_payload.py \
              --helper xr_mobile/embedded/app/build/outputs/apk/release/app-release-unsigned.apk \
              --runtime "$RUNNER_TEMP/phonexr-runtime.apk" --apktool-jar "$RUNNER_TEMP/apktool.jar" \
              --output "$RUNNER_TEMP/xr-injection"
            export XR_ARSCLIB_JAR="$RUNNER_TEMP/ARSCLib.jar" XR_INJECTION_ASSETS_DIR="$RUNNER_TEMP/xr-injection"
            gradle -p xr_mobile/android --no-daemon assembleDebug assembleDebugAndroidTest
          fi
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercitar seletor, instalação, OBB, sensores e broker
        uses: reactivecircus/android-emulator-runner@v2
        env:
          XR_TEST_QUICK: ${{ inputs.quick == true && '1' || '0' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          script: python3 xr_mobile/emulator_test.py
      - name: Guardar evidências do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xr-teste-emulador
          path: xr-capture/
          if-no-files-found: warn
          retention-days: 14
