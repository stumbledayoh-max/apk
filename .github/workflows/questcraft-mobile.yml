name: QuestCraft Mobile (experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - 'questcraft_mobile/**'
      - '!questcraft_mobile/emulator_screenshot.sh'
      - '.github/workflows/questcraft-mobile.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testar adaptação do manifesto
        run: python3 -m unittest discover -s questcraft_mobile/tests -v
      - name: Baixar modelo de mãos fixado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/questcraft-model"
          model="$RUNNER_TEMP/questcraft-model/hand_landmarker.task"
          if ! curl --fail --location --retry 3 -o "$model" \
            'https://raw.githubusercontent.com/samrat1games/phonexr/f393ea8c3f4579995efb7402d61a2108121b0900/orangehanding/src/main/assets/hand_landmarker.task'; then
            echo '::error title=Modelo de mãos::Não foi possível baixar o modelo fixado.'
            exit 1
          fi
          actual=$(sha256sum "$model" | cut -d' ' -f1)
          if [ "$actual" != fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1 ]; then
            echo "::error title=Modelo de mãos::SHA-256 inesperado: $actual"
            exit 1
          fi
      - name: Compilar ponte Android integrada
        env:
          QUESTCRAFT_HAND_MODEL_DIR: ${{ runner.temp }}/questcraft-model
        shell: bash
        run: |
          set -o pipefail
          if ! gradle -p questcraft_mobile/embedded --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/embedded-build.log"; then
            message=$(tail -n 35 "$RUNNER_TEMP/embedded-build.log" | tr '\n' ' ' | cut -c1-3500)
            printf '::error title=Falha ao compilar suporte integrado::%s\n' "$message"
            exit 1
          fi
      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/zipalign" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar "$RUNNER_TEMP/apktool.jar" --version
      - name: Adaptar e assinar APK oficial para arm64
        shell: bash
        run: |
          set -o pipefail
          if ! python3 questcraft_mobile/build_apk.py \
            --apktool-jar "$RUNNER_TEMP/apktool.jar" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --debug-keystore "$RUNNER_TEMP/questcraft-debug.p12" \
            --output questcraft-build/QuestCraft-Mobile-debug.apk 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            message=$(tail -n 8 "$RUNNER_TEMP/build.log" | tr '\n' ' ' | cut -c1-2000)
            printf '::error title=Falha ao gerar o APK::%s\n' "$message"
            exit 1
          fi
      - name: Instruções no pacote
        run: |
          cp questcraft_mobile/LEIA-PRIMEIRO.txt questcraft-build/LEIA-PRIMEIRO.txt
          cp questcraft_mobile/README.md questcraft-build/README-DETALHADO.md
      - uses: actions/upload-artifact@v4
        with:
          name: QuestCraft-Mobile-unico-experimental
          path: questcraft-build/
          if-no-files-found: error
          retention-days: 14
