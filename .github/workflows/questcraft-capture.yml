name: Captura experimental do QuestCraft

on:
  workflow_dispatch:
    inputs:
      renderer:
        description: 'Renderizador do emulador (software; não equivale a GPU física)'
        type: choice
        default: swiftshader_indirect
        options:
          - swiftshader_indirect
          - swangle
  push:
    paths:
      - '.github/workflows/questcraft-capture.yml'
      - 'questcraft_mobile/emulator_screenshot.sh'

permissions:
  contents: read
  actions: read

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Baixar a última build experimental desta branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow questcraft-mobile.yml --branch "$GITHUB_REF_NAME" \
            --status success --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          mkdir -p "$RUNNER_TEMP/questcraft-apk"
          echo "$RUN_ID" > "$RUNNER_TEMP/questcraft-apk/build-run-id.txt"
          gh run download "$RUN_ID" --name QuestCraft-Mobile-unico-experimental --dir "$RUNNER_TEMP/questcraft-apk"
          APK="$RUNNER_TEMP/questcraft-apk/QuestCraft-Mobile-debug.apk"
          test -f "$APK"
          # Never silently test the older, external-PhoneXR build.
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-entries.txt"
          grep -Fxq 'lib/arm64-v8a/libmonado-service.so' "$RUNNER_TEMP/apk-entries.txt"
          grep -Fxq 'assets/hand_landmarker.task' "$RUNNER_TEMP/apk-entries.txt"
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tentar abrir o port no emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          QUESTCRAFT_CAPTURE_RENDERER: ${{ inputs.renderer || 'swiftshader_indirect' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu ${{ inputs.renderer || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash questcraft_mobile/emulator_screenshot.sh
      - name: Guardar capturas e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questcraft-captura-emulador
          path: capture/
          if-no-files-found: warn
          retention-days: 14
