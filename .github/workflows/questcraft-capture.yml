name: Captura experimental do QuestCraft

on:
  workflow_dispatch:
    inputs:
      transfer_url:
        description: 'Endereço temporário do ambiente de teste (opcional)'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/questcraft-capture.yml'
      - 'questcraft_mobile/emulator_screenshot.sh'

permissions:
  contents: read
  actions: read

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Baixar a última build experimental desta branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow questcraft-mobile.yml --branch "$GITHUB_REF_NAME" \
            --status success --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          mkdir -p "$RUNNER_TEMP/questcraft-apk"
          gh run download "$RUN_ID" --name QuestCraft-Mobile-unico-experimental --dir "$RUNNER_TEMP/questcraft-apk"
          APK="$RUNNER_TEMP/questcraft-apk/QuestCraft-Mobile-debug.apk"
          test -f "$APK"
          # Never silently test the older, external-PhoneXR build.
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-entries.txt"
          grep -Fxq 'lib/arm64-v8a/libmonado-service.so' "$RUNNER_TEMP/apk-entries.txt"
          grep -Fxq 'assets/hand_landmarker.task' "$RUNNER_TEMP/apk-entries.txt"
      - name: Transferência opcional ao ambiente de teste
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          # Read the dispatch payload without echoing the short-lived upload URL.
          url=$(python3 -c 'import json,os,re,sys; u=json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs",{}).get("transfer_url", ""); sys.exit(2) if u and not re.fullmatch(r"https://[0-9]+-[a-z0-9]+\.e2b\.app/ingest/[a-f0-9]{64}",u) else print(u)')
          if [ -n "$url" ]; then
            echo "::add-mask::$url"
            apk="$RUNNER_TEMP/questcraft-apk/QuestCraft-Mobile-debug.apk"
            expected=$(sha256sum "$apk" | cut -d' ' -f1)
            curl --fail --silent --show-error --retry 2 --max-time 180 \
              -H "X-Expected-SHA256: $expected" --data-binary "@$apk" "$url"
            echo "SHA-256 do APK transferido: $expected"
          fi
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tentar abrir o port no emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash questcraft_mobile/emulator_screenshot.sh
      - name: Transferir diagnóstico ao ambiente de teste
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          url=$(python3 -c 'import json,os,re,sys; u=json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs",{}).get("transfer_url", ""); sys.exit(2) if u and not re.fullmatch(r"https://[0-9]+-[a-z0-9]+\.e2b\.app/ingest/[a-f0-9]{64}",u) else print(u)')
          if [ -n "$url" ] && [ -d capture ]; then
            echo "::add-mask::$url"
            zip -qr "$RUNNER_TEMP/capture-transfer.zip" capture
            expected=$(sha256sum "$RUNNER_TEMP/capture-transfer.zip" | cut -d' ' -f1)
            curl --fail --silent --show-error --retry 2 --max-time 180 \
              -H 'X-Transfer-File: capture' -H "X-Expected-SHA256: $expected" \
              --data-binary "@$RUNNER_TEMP/capture-transfer.zip" "$url"
          fi
      - name: Guardar capturas e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questcraft-captura-emulador
          path: capture/
          if-no-files-found: warn
          retention-days: 14
