name: XR de Bolso (Android experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - 'xr_mobile/**'
      - 'questcraft_mobile/integrated.py'
      - 'questcraft_mobile/build_apk.py'
      - '.github/workflows/xr-mobile.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testar empacotamento e limites de segurança
        run: |
          python3 -m unittest discover -s questcraft_mobile/tests -v
          python3 -m unittest discover -s xr_mobile/tests -v
      - name: Baixar modelo e runtime fixados e verificar hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xr-model"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/xr-model/hand_landmarker.task" \
            'https://raw.githubusercontent.com/samrat1games/phonexr/f393ea8c3f4579995efb7402d61a2108121b0900/orangehanding/src/main/assets/hand_landmarker.task'
          echo 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1  '"$RUNNER_TEMP/xr-model/hand_landmarker.task" | sha256sum -c -
          curl --fail --location --retry 3 -H 'Accept: application/vnd.github.raw+json' \
            -o "$RUNNER_TEMP/phonexr-runtime.apk" \
            'https://api.github.com/repos/samrat1games/phonexr/contents/app/src/main/assets/runtime/phonexr-runtime.apk?ref=f393ea8c3f4579995efb7402d61a2108121b0900'
          echo '56dd0f53317e1e70d240d4de39217f7553011a04b1d4cf22a637de6d1ebf7fa8  '"$RUNNER_TEMP/phonexr-runtime.apk" | sha256sum -c -
      - name: Compilar launcher nativo e testar lógica de mãos e OBB
        env:
          XR_HAND_MODEL_DIR: ${{ runner.temp }}/xr-model
        shell: bash
        run: |
          set -o pipefail
          if ! gradle -p xr_mobile/android --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/xr-gradle.log"; then
            message=$(tail -n 45 "$RUNNER_TEMP/xr-gradle.log" | tr '\n' ' ' | cut -c1-4000)
            printf '::error title=Falha na compilação Android::%s\n' "$message"
            exit 1
          fi
      - name: Integrar Monado e assinar APK de teste
        shell: bash
        run: |
          set -o pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/apktool.jar" \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          if ! python3 xr_mobile/build_runtime.py \
            --app xr_mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            --runtime "$RUNNER_TEMP/phonexr-runtime.apk" \
            --apktool-jar "$RUNNER_TEMP/apktool.jar" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --debug-keystore "$RUNNER_TEMP/xr-debug.p12" \
            --output xr-mobile-build/XR-de-Bolso-debug.apk 2>&1 | tee "$RUNNER_TEMP/xr-build.log"; then
            message=$(tail -n 20 "$RUNNER_TEMP/xr-build.log" | tr '\n' ' ' | cut -c1-3000)
            printf '::error title=Falha ao integrar runtime::%s\n' "$message"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: XR-de-Bolso-experimental
          path: xr-mobile-build/
          if-no-files-found: error
          retention-days: 14
